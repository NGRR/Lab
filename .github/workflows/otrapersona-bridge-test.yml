name: Otrapersona Bridge smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/otrapersona/bridge/**'
      - 'experiments/otrapersona/bridge.js'
      - '.github/workflows/otrapersona-bridge-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          python3 -m py_compile experiments/otrapersona/bridge/bridge.py
          node --check experiments/otrapersona/bridge.js
      - name: Live HTTPS smoke test (no TV commands)
        run: python3 experiments/otrapersona/bridge/test_endpoint.py
