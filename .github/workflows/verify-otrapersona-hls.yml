name: Verify Otrapersona encrypted stream
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-otrapersona-hls.yml'
      - 'experiments/otrapersona/assets/stream/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published stream and key
        shell: bash
        run: |
          cd experiments/otrapersona
          test -z "$(find . -iname '*.mp3' -type f -print)"
          test "$(wc -c < assets/stream/audio.key)" -eq 16
          grep -q 'METHOD=AES-128' assets/stream/album.m3u8
          test "$(find assets/stream -name '*.ts' -type f | wc -l)" -eq 62
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -hide_banner -loglevel error -xerror -allowed_extensions ALL -i assets/stream/album.m3u8 -f null -
          echo 'Validated AES-128 HLS and absence of source MP3.'
